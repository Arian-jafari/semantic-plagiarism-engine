[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-plagiarism-engine"
version = "0.1.0"
description = "A MinHash and Vector-based Semantic Plagiarism Detection Engine"
authors = [
    {name = "Arian Jafari"},
    {name = "Mehrnia Amouei"}
]
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0"
]
requires-python = ">=3.10"